# OGC Application Package config (ogc-app-pack-generator)
# Thin wrapper — science from NASA-IMPACT/veda-black-marble via build.sh
algorithm_description: >
  OGC Application Package for VEDA Black Marble. At build time shallow-clones
  NASA-IMPACT/veda-black-marble and syncs with uv; at run time loads
  EARTHDATA_TOKEN from MAAP Secrets and executes `uv run blackmarble`.
algorithm_name: veda-black-marble
algorithm_version: main
keywords: ogc, black-marble, viirs, landsat, nighttime-lights, veda, maap
code_repository: https://github.com/NASA-IMPACT/veda-black-marble-ogc.git
repository_url: https://github.com/NASA-IMPACT/veda-black-marble-ogc.git
citation: https://github.com/NASA-IMPACT/veda-black-marble
author: HarshiniGirish
contributor: HarshiniGirish
license: https://github.com/NASA-IMPACT/veda-black-marble/blob/main/LICENSE
release_notes: Thin OGC layer; uv run against upstream shallow clone; Secrets for Earthdata.
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v6.0.0
disk_space: 40GB
queue: maap-dps-worker-16gb
build_command: veda-black-marble-ogc/build.sh
run_command: /opt/app/run.sh
ram_min: 8192
cores_min: 2
outdir_max: 4096

inputs:
  - name: bbox
    doc: Bounding box as min_lon,min_lat,max_lon,max_lat (WGS84). Lat span >= 0.05 deg.
    label: bounding box
    type: string
  - name: date
    doc: Target date YYYY-MM-DD
    label: date
    type: string
  - name: config
    doc: Preset — default, high_quality, or fast
    label: config preset
    type: string?
  - name: osm_source
    doc: OSM backend — overpass or layercake
    label: OSM source
    type: string?
  - name: wgs84
    doc: Also export EPSG:4326 (true/false)
    label: WGS84 export
    type: string?
  - name: basename
    doc: Output stem → output/<basename>.tif (maps to --output-path)
    label: basename
    type: string?
  - name: earthdata_secret_name
    doc: MAAP secret name for Earthdata token (not the token value)
    label: Earthdata secret name
    type: string?

outputs:
  - name: out
    type: Directory
