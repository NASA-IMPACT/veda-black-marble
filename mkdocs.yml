site_name: VEDA Black Marble
site_description: Nighttime lights processing pipeline for NASA VEDA
site_url: https://nasa-impact.github.io/veda-black-marble/
repo_name: NASA-IMPACT/veda-black-marble
repo_url: https://github.com/NASA-IMPACT/veda-black-marble
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

docs_dir: docs

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false

nav:
  - Home: index.md
  - Release Notes: RELEASE_NOTES.md
  - Contributors:
      - Contributing Guide: contributors/contributing-guide.md
      - Testing and Reference Data: contributors/testing-and-reference-data.md
  - Pipeline Steps:
      - Overview: pipeline-steps/README.md
      - VIIRS Preprocessing: pipeline-steps/viirs-preprocessing.md
      - Landsat Search: pipeline-steps/landsat-search.md
      - Landsat QA Masking: pipeline-steps/landsat-qa-masking.md
      - Temporal Compositing: pipeline-steps/temporal-compositing.md
      - Spatial Alignment: pipeline-steps/spatial-alignment.md
      - Spectral Indices: pipeline-steps/spectral-indices.md
      - NDUI Calculation: pipeline-steps/ndui-calculation.md
      - Urban Field Enhancement: pipeline-steps/urban-field-enhancement.md
      - Statistics Calculation: pipeline-steps/statistics-calculation.md
  - API Reference:
      - Overview: api-reference.md
