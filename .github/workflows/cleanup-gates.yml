name: phase1-diagnostics

on:
  pull_request:
  push:
    branches: [main]

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    continue-on-error: true          # non-blocking gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install deps
        run: |
          python -m pip install -U pip
          pip install uv
          uv add --dev black isort ruff pyright vulture autoflake types-requests radon interrogate
          uv pip install -e .
      - name: run audit scripts
        run: |
          uv run python scripts/generate_baseline_metrics.py
      - name: upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.sha }}
          path: .metrics/*.json