[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmarble"
version = "0.1.0"
description = "Black Marble NDUI processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.37.38,<2.0",
    "fiona>=1.10.1,<2.0",
    "gdal>=3.10.1,<4.0",
    "geopy>=2.4.1,<3.0",
    "h5py>=3.14.0",
    "mypy-boto3-s3>=1.38.0,<2.0",
    "numpy>=2.2.5,<3.0",
    "osmnx>=2.0.2,<3.0",
    "pytest>=8.3.5,<9.0",
    "rasterio>=1.4.3,<2.0",
    "requests>=2.32.3,<3.0",
    "rio-cogeo>=5.4.1,<6.0",
    "scipy>=1.15.3",
    "shapely>=2.1.0,<3.0",
    "typer>=0.15.3,<1.0",
    "utm>=0.8.1,<1.0",
]

[project.scripts]
blackmarble = "blackmarble.cli:app"

[tool.setuptools]
packages = ["blackmarble"]

[tool.setuptools.package-data]
blackmarble = ["data/*.npy", "data/WRS2_descending_0/*"]

# ───────────────────────────────────────────────────────────────
# Dev / test extras
# ───────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
  "scalene>=1.5.51",
  "pre-commit>=4.2.0",
  "pytest>=8.3.5",
  "pyright>=1.1.402",
  "psutil>=7.0.0",
]

[tool.pytest.ini_options]
addopts = "-raqs"
testpaths = ["tests"]

[tool.pyright]
# Docker utility files may have dependencies not available during type checking
exclude = ["docker/"]
