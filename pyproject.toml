[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmarble"
version = "0.1.0"
description = "Black Marble NDUI processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.10",
    "aioboto3>=14.3.0",
    "boto3<1.38",
    "fiona>=1.10.1,<2.0",
    "gdal==3.10.1",
    "geopy>=2.4.1,<3.0",
    "h5py>=3.14.0",
    "mypy-boto3-s3>=1.38.0,<2.0",
    "numpy<2",
    "osmnx>=2.0.2,<3.0",
    "pytest>=8.3.5,<9.0",
    "rasterio>=1.4.3,<2.0",
    "requests>=2.32.3,<3.0",
    "rio-cogeo>=5.4.1,<6.0",
    "scipy>=1.15.3",
    "shapely>=2.1.0,<3.0",
    "typer>=0.15.3,<1.0",
    "utm>=0.8.1,<1.0",
    "matplotlib>=3.10.3",
    "tqdm>=4.67.1",
    "pandas==2.1.1",
    "nest-asyncio>=1.6.0",
    "psutil>=7.0.0",
]

[project.scripts]
blackmarble = "blackmarble.cli:app"

[tool.setuptools]
# Use automatic package discovery to find all subpackages
packages.find = {}

[tool.setuptools.package-data]
blackmarble = ["data/*.npy", "data/WRS2_descending_0/*"]

# ───────────────────────────────────────────────────────────────
# Dev / test extras
# ───────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
  "scalene>=1.5.51",
  "pre-commit>=4.2.0",
  "pytest>=8.3.5",
  "pyright>=1.1.402",
  "black==23.12.1",
  "isort==5.13.2",
  "ruff==0.3.5",
  "vulture==2.7",
  "autoflake==2.2.0",
  "types-requests",
  "radon>=6.0.1",
  "interrogate>=1.5.0",
  "hypothesis>=6.136.1",
  "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
addopts = "-raqs"
testpaths = ["tests"]
markers = [
    "edgecase: mark test as testing mathematical or algorithmic edge cases with synthetic data",
    "integration: mark test as integration test requiring real data downloads (skip by default)",
]

[tool.pyright]
# Docker utility files may have dependencies not available during type checking
exclude = ["docker/"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
stubPath = "blackmarble-stubs"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"  # We have our own stubs
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUntypedFunctionDecorator = "none"
reportUntypedClassDecorator = "error"

# ───────────────────────────────────────────────────────────────
# Code Quality Tools Configuration
# ───────────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.metrics
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
float_to_top = true
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F","I","E","W","UP"]          # basic correctness & pyupgrade
ignore = []                              # none ignored; we just won't fail yet

# Pyright is configured in the existing [tool.pyright] section above
# We'll use pyright instead of mypy for type checking

[tool.vulture]
min_confidence = 80
sort_by_size = true
exclude = ["tests/*", "notebooks/*", "scripts/*", "docker/*"]

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true
ignore-init-module-imports = true
in-place = false         # never rewrite in baseline phase
exclude = "**/__init__.py"
