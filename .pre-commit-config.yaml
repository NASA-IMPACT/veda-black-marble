repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.13
  hooks:
  - id: ruff-check
  - id: ruff-format

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.16.0
  hooks:
  -   id: mypy
      args: [--ignore-missing-imports, --no-strict-optional, --allow-untyped-decorators]
      additional_dependencies: [types-requests, pydantic, types-aiofiles]
